name: Release Linux

# A tag like v1.0.0 builds Colitu VPN for x64 and arm64, packages .deb, .rpm and
# .tar.gz (scripts/package-linux.sh) and attaches them with SHA256SUMS to a
# GitHub release. The update manifest for colitu.com is signed offline
# (scripts/sign-linux-manifest.ps1), never here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y rpm rsync unzip

      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --project v2rayN/ColituVPN.Tests -c Release

      - name: Publish
        env:
          # Colitu's ad-blocking DNS nodes are build-time secrets, never in the source.
          COLITU_ADBLOCK_DOH: ${{ secrets.COLITU_ADBLOCK_DOH }}
        run: |
          dotnet publish v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r linux-${{ matrix.arch }} \
            -p:SelfContained=true -p:PublishSingleFile=false -p:Version="$VERSION" \
            -p:ColituAdBlockDoh="$COLITU_ADBLOCK_DOH" -o publish

      - name: Package
        run: bash scripts/package-linux.sh "$VERSION" ${{ matrix.arch }} publish dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Colitu VPN for Linux ${{ env.TAG }}
          prerelease: true
          files: dist/*
          body: |
            Colitu VPN for Linux. Install on Debian/Ubuntu/Mint with the `.deb`, on Fedora/RHEL/openSUSE with the `.rpm`, or unpack the `.tar.gz` on any distribution.
            Guide: https://colitu.com/download/linux · Checksums: `SHA256SUMS`.
