name: Release Linux

# A tag like v1.0.0 builds Colitu VPN for x64 and arm64, packages .deb, .rpm and
# .tar.gz (scripts/package-linux.sh) and attaches them with SHA256SUMS to a
# GitHub release. The update manifest for colitu.com is signed offline
# (scripts/sign-linux-manifest.ps1), never here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

# Read-only by default; only the release job (no build tools, no restore) can write.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y rpm rsync unzip

      - name: Version
        # x.y.z only: rpm rejects '-' in Version and dpkg would sort a "-rc" after the release.
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --project src/ColituVPN.Tests -c Release

      - name: Publish
        env:
          # Colitu's ad-blocking DNS nodes are build-time secrets, never in the source.
          # MSBuild reads the comma-separated list from the environment (-p: would split it).
          ColituAdBlockDoh: ${{ secrets.COLITU_ADBLOCK_DOH }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ColituAdBlockDoh" in https://*) ;; *) echo "::error::COLITU_ADBLOCK_DOH secret is missing"; exit 1 ;; esac
          dotnet publish src/ColituVPN/ColituVPN.csproj -c Release -r "linux-$ARCH" \
            -p:SelfContained=true -p:PublishSingleFile=false -p:Version="$VERSION" -o publish

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/package-linux.sh "$VERSION" "$ARCH" publish dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: Colitu VPN for Linux ${{ env.TAG }}
          prerelease: true
          files: dist/*
          body: |
            Colitu VPN for Linux. Install on Debian/Ubuntu/Mint with the `.deb`, on Fedora/RHEL with the `.rpm`, or unpack the `.tar.gz` on any distribution.
            Guide: https://colitu.com/download/linux · Checksums: `SHA256SUMS`.
