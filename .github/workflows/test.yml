name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Colitu tests
        run: dotnet test --project src/ColituVPN.Tests -c Release
      - name: ServiceLib tests
        run: dotnet test --project src/ServiceLib.Tests -c Release
      - name: Linux build
        run: dotnet build src/ColituVPN/ColituVPN.csproj -c Release -r linux-x64
