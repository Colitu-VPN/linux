name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Colitu tests
        run: dotnet test --project src/ColituVPN.Tests -c Release
      - name: ServiceLib tests
        run: dotnet test --project src/ServiceLib.Tests -c Release
      - name: Linux build
        run: dotnet build src/ColituVPN/ColituVPN.csproj -c Release -r linux-x64
